spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/geo_drilling_db
    driver-class-name: org.postgresql.Driver
    username: geolite_dba
    password: geo_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false  # Disable the H2 console as it's no longer needed

  # Configure Spring Cloud Stream (example for RabbitMQ)
  cloud:
    stream:
      bindings:
        drillingStarted:
          destination: drilling-started
          contentType: application/json
        drillingCompleted:
          destination: drilling-completed
          contentType: application/json
        drillingUpdated:
          destination: drilling-updated
          contentType: application/json
        drillingDeleted:
          destination: drilling-deleted
          contentType: application/json
        scenarioCreated:
          destination: scenario-created
          contentType: application/json
        scenarioUpdated:
          destination: scenario-updated
          contentType: application/json
        scenarioDeleted:
          destination: scenario-deleted
          contentType: application/json
        projectCreated:
          destination: project-created
          contentType: application/json
        projectUpdated:
          destination: project-updated
          contentType: application/json
        projectDeleted:
          destination: project-deleted
          contentType: application/json
      kafka:
        bootstrap-servers: localhost:9092
        streams:
          application-id: scenario-streams
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.apache.kafka.common.serialization.JsonSerializer
        consumer:
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer
          properties:
            spring.json.trusted.packages: "*"
      rabbit:
        binder:
          nodes:
            default:
              port: 5672
    redis:
      host: localhost
      port: 6379

server:
  port: 8282
